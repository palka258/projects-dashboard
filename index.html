<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои проекты</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --border: #e4e1da;
    --text: #1c1b19;
    --text-dim: #6b6860;
    --accent: #a8621d;
    --done: #3f7d4a;
    --done-bg: #e6f2e8;
    --progress: #a8621d;
    --progress-bg: #f6ead9;
    --todo: #7a7568;
    --todo-bg: #ece9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #201f1c;
      --border: #34322c;
      --text: #ede9e1;
      --text-dim: #a3a094;
      --accent: #d99a4e;
      --done: #7bc48f;
      --done-bg: #1e2f22;
      --progress: #d99a4e;
      --progress-bg: #362a17;
      --todo: #9b9788;
      --todo-bg: #2a2823;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
  }
  header {
    max-width: 1040px;
    margin: 0 auto;
    padding: 48px 24px 16px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }
  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 8px 24px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    align-items: start;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
  }
  .card[open] {
    border-color: var(--accent);
  }
  .card > summary {
    list-style: none;
    cursor: pointer;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary .chevron {
    color: var(--text-dim);
    font-size: 12px;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .card[open] > summary .chevron { transform: rotate(90deg); }
  .card-body {
    padding: 0 20px 20px;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .card-head h2 {
    margin: 0;
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.done { color: var(--done); background: var(--done-bg); }
  .badge.in_progress { color: var(--progress); background: var(--progress-bg); }
  .badge.todo { color: var(--todo); background: var(--todo-bg); }
  .version {
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .head-badges {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .desc {
    color: var(--text-dim);
    font-size: 14px;
    margin: 8px 0 0;
  }
  .links {
    margin-top: 10px;
    display: flex;
    gap: 14px;
    font-size: 13px;
  }
  .links a {
    color: var(--accent);
    text-decoration: none;
  }
  .links a:hover { text-decoration: underline; }
  ul.stages {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ul.stages li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  ul.stages li:first-child { border-top: none; padding-top: 0; }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .dot.done { background: var(--done); }
  .dot.in_progress { background: var(--progress); }
  .dot.todo { background: var(--todo); }
  .stage-body .title { font-weight: 500; }
  .stage-body .note { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .meta {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-dim);
  }
  footer {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px 48px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .empty { color: var(--text-dim); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Мои проекты</h1>
  <p>Статус по всем проектам в одном месте. Обновляется через <code>projects.json</code> — попроси Claude поправить его в любом чате.</p>
</header>
<main id="app"></main>
<footer id="footer"></footer>

<script>
const STATUS_LABEL = { done: "Готово", in_progress: "В работе", todo: "В планах" };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderProject(p) {
  const card = document.createElement("details");
  card.className = "card";

  const summary = document.createElement("summary");
  const head = el("div", "card-head");
  head.appendChild(el("h2", null, p.name));
  const badges = el("div", "head-badges");
  if (p.version) badges.appendChild(el("span", "version", p.version));
  badges.appendChild(el("span", "badge " + p.status, STATUS_LABEL[p.status] || p.status));
  head.appendChild(badges);
  summary.appendChild(head);
  summary.appendChild(el("span", "chevron", "▸"));
  card.appendChild(summary);

  const body = el("div", "card-body");

  if (p.description) body.appendChild(el("p", "desc", p.description));

  if (p.repo || p.liveUrl) {
    const links = el("div", "links");
    if (p.liveUrl) {
      const a = el("a", null, "Сайт →");
      a.href = p.liveUrl; a.target = "_blank"; a.rel = "noopener";
      links.appendChild(a);
    }
    if (p.repo) {
      const a = el("a", null, "Репозиторий →");
      a.href = p.repo; a.target = "_blank"; a.rel = "noopener";
      links.appendChild(a);
    }
    body.appendChild(links);
  }

  if (p.stages && p.stages.length) {
    const ul = el("ul", "stages");
    p.stages.forEach(s => {
      const li = el("li");
      li.appendChild(el("div", "dot " + s.status));
      const stageBody = el("div", "stage-body");
      stageBody.appendChild(el("div", "title", s.title));
      if (s.note) stageBody.appendChild(el("div", "note", s.note));
      li.appendChild(stageBody);
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  if (p.updatedAt) body.appendChild(el("div", "meta", "Обновлено: " + p.updatedAt));

  card.appendChild(body);
  return card;
}

fetch("projects.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    const app = document.getElementById("app");
    if (!data.projects || !data.projects.length) {
      app.appendChild(el("p", "empty", "Проектов пока нет."));
      return;
    }
    data.projects.forEach(p => app.appendChild(renderProject(p)));
    if (data.updated) {
      document.getElementById("footer").textContent = "Дашборд обновлён: " + data.updated;
    }
  })
  .catch(err => {
    document.getElementById("app").appendChild(
      el("p", "empty", "Не удалось загрузить projects.json: " + err.message)
    );
  });
</script>
</body>
</html>
